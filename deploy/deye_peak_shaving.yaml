# Deye — Grid Peak Shaving Schedule
# =================================
# Enables grid peak-shaving daily from 11:00 to 14:00, and disables it outside
# that window. Peak-shaving caps the power the inverter will pull from the grid;
# once grid import hits that cap, the inverter can no longer use grid power to
# charge the battery, so charging may slow. The second automation warns Oscar
# when that limit is actually hit.
#
# Gen peak-shaving is deliberately left alone — only the grid switch is touched.
# Grid and gen share the packed 0x00B2 flag register, and writing both at once
# raced (the two read-modify-writes clobbered each other, flipping grid back off
# a second later). Writing only the grid switch removes that race entirely.
#
# The enable state lives in the 0x00B2 flag register; the integration's Grid
# Peak Shaving switch read-modify-writes it. The W cap is set independently via
# the Grid Peak Shave Power number and is left untouched here — edit it in the
# UI and the integration pushes the change through on the spot.
#
# Like the sell schedule, BLE write resilience lives in the integration (each
# write retries + read-back-verifies), so these automations issue writes once
# with continue_on_error, then verify and notify Oscar only if it didn't land.

automation:
  # --- Window: on at 11:00, off at 14:00 (and reassert on HA start) ----------
  - id: deye_peak_shaving_window
    alias: "Battery — Grid Peak Shaving Window"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: time
        at: "11:00:00"
      - platform: time
        at: "14:00:00"
      - platform: homeassistant
        event: start
    action:
      - variables:
          in_window: "{{ today_at('11:00') <= now() < today_at('14:00') }}"
          desired: "{{ 'on' if in_window else 'off' }}"

      # Templated service resolves to switch.turn_on / switch.turn_off.
      # Grid only — gen peak-shaving is left untouched to avoid the shared-
      # register write race that flipped grid back off.
      - action: "switch.turn_{{ desired }}"
        continue_on_error: true
        target:
          entity_id: switch.deye_inverter_ble_grid_peak_shaving

      # Wait for the read-back to show the wanted state. A fixed delay raced
      # concurrent writes (sell schedule at 11:00) and alerted on a stale poll.
      - wait_template: >
          {{ is_state('switch.deye_inverter_ble_grid_peak_shaving', desired) }}
        timeout: "00:01:30"
        continue_on_timeout: true

      # --- Not landed: alert, keep watching, then all-clear or re-alert -----
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: notify.oscar
            data:
              title: "⚠️ Deye peak-shaving toggle failed"
              message: >
                Wanted grid peak shaving {{ desired }}, still
                {{ states('switch.deye_inverter_ble_grid_peak_shaving') }} after 90s.
                Watching for 15 min.
          - wait_template: >
              {{ is_state('switch.deye_inverter_ble_grid_peak_shaving', desired) }}
            timeout: "00:15:00"
            continue_on_timeout: true
          - action: notify.oscar
            data:
              title: >
                {{ '✅ Deye peak shaving OK now' if wait.completed
                   else '❌ Deye peak shaving still failed' }}
              message: >
                Grid peak shaving is
                {{ states('switch.deye_inverter_ble_grid_peak_shaving') }}
                (wanted {{ desired }}).

  # --- Alert when grid import actually reaches the grid peak-shave cap --------
  # grid_power is signed: positive = importing from the grid. When import climbs
  # to (near) the grid peak-shave cap, the inverter is limiting grid draw and can
  # no longer lean on the grid to charge the battery.
  - id: deye_peak_shaving_grid_limit
    alias: "Battery — Grid Import Hit Peak-Shave Cap"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: template
        # Fire once grid import sits within 2% of the cap for a full minute
        # (the sustained hold avoids a notification on a momentary spike).
        value_template: >
          {{ is_state('switch.deye_inverter_ble_grid_peak_shaving', 'on')
             and states('sensor.deye_inverter_ble_grid_power') | int(0)
                 >= (states('number.deye_inverter_ble_grid_peak_shave_power') | int(999999) * 0.98) }}
        for: "00:01:00"
    condition:
      # Only during the shaving window — belt-and-braces with the switch state.
      - condition: time
        after: "11:00:00"
        before: "14:00:00"
    action:
      - action: persistent_notification.create
        data:
          notification_id: deye_grid_peak_shave_limit
          title: "🔌 Grid import at peak-shave limit"
          message: >
            Grid import ({{ states('sensor.deye_inverter_ble_grid_power') }} W) has reached the
            grid peak-shave cap ({{ states('number.deye_inverter_ble_grid_peak_shave_power') }} W).
            Battery charge may be reduced because of grid import limits.
      - action: notify.oscar
        data:
          title: "🔌 Grid import at peak-shave limit"
          message: >
            Grid import ({{ states('sensor.deye_inverter_ble_grid_power') }} W) reached the peak-shave
            cap ({{ states('number.deye_inverter_ble_grid_peak_shave_power') }} W).
            Battery charge may be reduced because of grid import limits.
